<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FSD highway speed check</title>
<style>
:root{--bg:#fbfbf9;--fg:#1f2328;--mut:#5f6670;--card:#fff;--line:#d8dce1;--sel:#d4351c;
--c0:#0072B2;--c1:#E69F00;--c2:#009E73;--c3:#CC79A7;--c4:#b9bec6;
--k0:#7b8794;--k1:#E69F00;--k2:#CC79A7;--k3:#D55E00;--k4:#b9bec6;--k5:#e3e6ea;
--o110:#009E73;--o100:#0072B2;--ooth:#8a8f96;--halo:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#16181c;--fg:#e8eaed;--mut:#9aa3ad;--card:#1e2126;--line:#343a42;--sel:#ff6a4d;
--c0:#56B4E9;--c1:#F0B429;--c2:#2FCB9C;--c3:#E39BC6;--c4:#59606a;
--k0:#8e9aa7;--k1:#F0B429;--k2:#E39BC6;--k3:#ff8a4d;--k4:#59606a;--k5:#2a2e34;
--o110:#2FCB9C;--o100:#56B4E9;--ooth:#8a8f96;--halo:#1e2126}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
header{padding:16px 16px 4px;max-width:1500px;margin:0 auto}h1{font-size:20px;margin:0 0 4px}
p.sub{margin:0;color:var(--mut);max-width:110ch}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;padding:10px 16px;max-width:1500px;margin:0 auto}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.kpi b{font-size:26px;display:block;line-height:1.1;font-variant-numeric:tabular-nums}.kpi span{color:var(--mut);font-size:12.5px}
.wrap{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:12px;padding:6px 16px 12px;max-width:1500px;margin:0 auto}
@media(max-width:1000px){.wrap{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px}
#mapbox{position:relative;height:74vh;min-height:430px;overflow:hidden}
canvas#cv{width:100%;height:100%;display:block;cursor:grab;touch-action:none}
#tip{position:absolute;pointer-events:none;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:12px;box-shadow:0 2px 8px #0003;display:none;max-width:270px;z-index:5}
.ovl{position:absolute;background:color-mix(in srgb,var(--card) 92%,transparent);border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:12px;z-index:4}
#seg{top:8px;left:8px;display:flex;gap:0;padding:2px}#seg button{border:0;border-radius:6px;padding:4px 10px;background:transparent}#seg button.on{background:var(--fg);color:var(--bg)}
#zoom{top:8px;right:8px;display:flex;flex-direction:column;gap:4px;padding:3px}#zoom button{width:30px;height:30px;padding:0;font-size:16px}
#legend{bottom:8px;left:8px;max-width:330px}#legend .li{display:flex;align-items:center;gap:7px;padding:1px 0}
#scale{bottom:8px;right:8px}
.sw{width:22px;height:0;border-top:4px solid;border-radius:2px;flex:none}.sw.dash{border-top-style:dashed}.sw.casing{height:9px;border:0;opacity:.35;border-radius:2px}
.sw.tri{width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-top:0;border-bottom:10px solid var(--fg);background:none}
.side{padding:12px;display:flex;flex-direction:column;gap:14px;max-height:calc(74vh + 4px);overflow:auto}
h2{font-size:12px;margin:0 0 6px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut)}
h3{font-size:15px;margin:0 0 6px}
label.chip{display:flex;align-items:center;gap:8px;padding:2px 0;cursor:pointer}
.n{margin-left:auto;color:var(--mut);font-variant-numeric:tabular-nums}
.dates{display:flex;flex-wrap:wrap;gap:6px}.dates label{border:1px solid var(--line);border-radius:999px;padding:2px 9px;cursor:pointer;user-select:none}.dates label.on{background:var(--fg);color:var(--bg)}
button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:8px;padding:3px 10px;cursor:pointer}
button:hover{border-color:var(--mut)}
small,.mut{color:var(--mut)}
a.ms{color:var(--c0);font-weight:600;text-decoration:none;white-space:nowrap}a.ms:hover{text-decoration:underline}
#sel .kv{display:grid;grid-template-columns:auto 1fr;gap:1px 10px;margin:6px 0}#sel .kv span:nth-child(odd){color:var(--mut)}
#strip{width:100%;height:150px;display:block;margin-top:6px}
.verdict{border-left:4px solid var(--k4);padding:4px 8px;margin:6px 0;background:color-mix(in srgb,var(--fg) 4%,transparent);border-radius:0 6px 6px 0}
.tabs{display:flex;gap:6px;flex-wrap:wrap;padding:0 16px;max-width:1500px;margin:6px auto 0}
.tabs button{border-radius:8px 8px 0 0;border-bottom:0;padding:6px 12px}.tabs button.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.panel{margin:0 auto 24px;max-width:1468px;padding:12px;overflow:auto;border-radius:0 10px 10px 10px;display:none}.panel.on{display:block}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:5px 9px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:top}th{font-size:12px;color:var(--mut);position:sticky;top:0;background:var(--card)}
td.wrapc{white-space:normal;min-width:220px}
tr.row{cursor:pointer}tr.row:hover td{background:color-mix(in srgb,var(--fg) 6%,transparent)}tr.row.cur td{background:color-mix(in srgb,var(--sel) 14%,transparent)}
.pill{padding:1px 8px;border-radius:999px;font-size:12px;border:1px solid var(--line);white-space:nowrap}
.p-110{background:color-mix(in srgb,var(--o110) 25%,transparent)}.p-100{background:color-mix(in srgb,var(--o100) 22%,transparent)}.p-mix{background:color-mix(in srgb,var(--c1) 28%,transparent)}
.gid{display:inline-block;min-width:26px;text-align:center;border-radius:6px;font-weight:700;color:#111;padding:0 5px}
.g-A{background:var(--k1)}.g-B{background:var(--k2)}.g-C{background:var(--k3);color:#fff}
.mbar{display:flex;height:10px;width:120px;border-radius:5px;overflow:hidden;background:var(--k5);border:1px solid var(--line)}.mbar i{display:block;height:100%}
tr.sub td{white-space:normal;background:color-mix(in srgb,var(--fg) 3%,transparent)}
table.in{font-size:12px;width:auto}table.in td,table.in th{padding:2px 10px;position:static}
.heat td.h{text-align:right}
.filters{display:flex;gap:12px;flex-wrap:wrap;margin:0 0 8px;align-items:center}
select{font:inherit;background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:2px 6px}
ol.how{margin:6px 0 0 18px;padding:0}ol.how li{margin:4px 0;max-width:110ch}
.note{max-width:110ch;color:var(--mut)}
</style></head><body>
<header><h1>FSD highway speed check <small id="built"></small></h1>
<p class="sub" id="sub"></p></header>
<div class="kpis" id="kpis"></div>
<div class="wrap">
 <div class="card" id="mapbox"><canvas id="cv"></canvas><div id="tip"></div>
  <div class="ovl" id="seg"><button data-v="cmp" class="on" title="Colour by how the car's speed compares with the OpenStreetMap limit">Compare with OpenStreetMap</button><button data-v="band" title="Colour by the speed the car ran at">Speed band</button></div>
  <div class="ovl" id="zoom"><button id="zin" aria-label="Zoom in">+</button><button id="zout" aria-label="Zoom out">&minus;</button><button id="fit" title="Fit whole route" aria-label="Fit route">&#x2922;</button></div>
  <div class="ovl" id="legend"></div><div class="ovl" id="scale"></div></div>
 <div class="card side">
  <div id="sel"><h2>Selected</h2><small>Click a point, a flip marker or a lettered marker on the map, or a row in any table below.</small></div>
  <div><h2>Layers</h2><div id="layers"></div></div>
  <div><h2 id="fh">Show</h2><div id="filt"></div></div>
  <div><h2>Day</h2><div class="dates" id="dates"></div></div>
  <div><small>Drag to pan, wheel or +/- to zoom. Times are the Sydney clock from the telemetry.</small></div>
 </div></div>
<div class="tabs" id="tabs"></div>
<div class="card panel" id="p-sl"></div><div class="card panel" id="p-fl"></div><div class="card panel" id="p-sec"></div>
<div class="card panel" id="p-st"></div><div class="card panel" id="p-cal"></div><div class="card panel" id="p-how"></div>
<script>
const D=/*DATA*/null;
const S=D.s, W=D.w, SM=D.sum;
const BANDN=["Standard in a 100 (101-102)","Hurry in a 100 / the 105 (104-106)","Standard in a 110 (112)","Hurry in a 110 (114-115)","Other speeds"];
const CAT=[["Agrees with OpenStreetMap","The car's speed class (100 or 110) matches the OSM limit"],
["105 on an OSM 110 road","The plateau: 104-106 km/h where OpenStreetMap says 110"],
["Standard 100 on an OSM 110 road","101-102 km/h where OpenStreetMap says 110"],
["110/115 on an OSM 100 road","112-115 km/h where OpenStreetMap says 100"],
["Other speed, or OSM limit not 100/110","Speeds outside the four bands, or an 80/90/no-tag OSM road"],
["Not matched","Below 85 km/h, or not on a mapped OpenStreetMap highway"]];
const VERDICT=["The car's speed fits the posted limit OpenStreetMap lists here.",
"Plateau on a road OpenStreetMap lists as 110: FSD probably read this as 100 (or OpenStreetMap is wrong). A candidate for a TomTom / sign check.",
"Standard-mode 100 on a road OpenStreetMap lists as 110: the car stayed at 100 here.",
"Running 110+ where OpenStreetMap says 100: OpenStreetMap may be out of date, or the posted limit changed.",
"Speed or OpenStreetMap limit outside the 100/110 comparison.","No OpenStreetMap highway matched this sample."];
const cv=document.getElementById("cv"),ctx=cv.getContext("2d"),tip=document.getElementById("tip");
const $=id=>document.getElementById(id);
const st={view:SM.has_osm?"cmp":"band",L:{osm:SM.has_osm,sec:true,sl:true,fl:true,pl:true,low:true},fc:[1,1,1,1,1,0],fb:[1,1,1,1,1],dayOn:{},sel:null};
if(!SM.has_osm){$("seg").style.display="none"}
const C=new Uint8Array(S.length);
function catOf(p){const o=p[7],b=p[6];if(p[2]<85||o===0)return 5;if(b===4||o<0)return 4;const per=b<2?100:110;if(o===per)return 0;if(per===100&&o===110)return b===1?1:2;if(per===110&&o===100)return 3;return 4}
S.forEach((p,i)=>C[i]=catOf(p));
const ccount=[0,0,0,0,0,0],bcount=[0,0,0,0,0];S.forEach((p,i)=>{if(p[2]>=85){ccount[C[i]]++;bcount[p[6]]++}});
const days=[...new Set(D.d.map(d=>d.date))];days.forEach(d=>st.dayOn[d]=true);
const dayOf=i=>D.d[S[i][5]].date;
const HM=t=>new Date(t*1000).toISOString().slice(11,16),HMS=t=>new Date(t*1000).toISOString().slice(11,19);
const comp=h=>h<0?"?":["N","NE","E","SE","S","SW","W","NW"][Math.round(h/45)%8];
const side=h=>{const c=comp(h);return {N:"west",NE:"north-west",E:"north",SE:"north-east",S:"east",SW:"south-east",W:"south",NW:"south-west"}[c]||""};
const MS=(a,b)=>`https://www.tomtom.com/mapshare/tools/new/mapshare/#loc=${(+a).toFixed(5)},${(+b).toFixed(5)},17`;
const GV=(a,b,h)=>`https://www.google.com/maps/@?api=1&map_action=pano&viewpoint=${(+a).toFixed(6)},${(+b).toFixed(6)}&heading=${Math.round(h)}&pitch=0&fov=90`;
const GM=(a,b)=>`https://www.google.com/maps/@${a},${b},17z`;
const brg=(a,b,c,d)=>{const p=Math.PI/180,y=Math.sin((d-b)*p)*Math.cos(c*p),x=Math.cos(a*p)*Math.sin(c*p)-Math.sin(a*p)*Math.cos(c*p)*Math.cos((d-b)*p);return(Math.atan2(y,x)/p+360)%360};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const lim=o=>o>0?o+" km/h":o<0?"no limit tag":"not matched";
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()}

/* ---- header, KPIs ---- */
$("built").textContent="built "+SM.built;
$("sub").innerHTML=`Telemetry from ${SM.drives} drives since ${SM.since} (${SM.samples.toLocaleString()} samples, ${SM.hwkm.toLocaleString()} km of highway). Tessie records whole mph, so the car's speed shows which limit it believed: 101-102 = standard in a 100, <b>104-106 = hurry in a 100 (the &ldquo;105&rdquo;)</b>, 112 = standard in a 110, 114-115 = hurry in a 110. Each sample is also matched to the road it was on in OpenStreetMap to read that road's posted limit. There is no FSD or speed-limit field in the telemetry, so the mode is inferred from speed.`;
const pct=(a,b)=>b?Math.round(100*a/b):0;
const sd=D.cal[2][0]+D.cal[3][0],sdt=D.cal[2].reduce((a,b)=>a+b,0)+D.cal[3].reduce((a,b)=>a+b,0);
const k=[[SM.km110.toFixed(0)+" km",`of the 105 plateau is on roads OpenStreetMap lists as 110 (${SM.sec110} of ${SM.sec} sections)`],
[SM.km100.toFixed(0)+" km",`is on roads it lists as 100 (${SM.sec100} sections): hurry in a genuine 100`],
[pct(sd,sdt)+"%",`of samples at 110/115 sit on OSM-110 roads, so OpenStreetMap is a fair reference here`],
[SM.flips_in110+" of "+SM.flips,`flips of the car's 100/110 reading happen mid-road, with OpenStreetMap showing 110 on both sides`],
[SM.sl+" points",`on the TomTom shortlist, with links`]];
$("kpis").innerHTML=k.map(x=>`<div class="kpi"><b>${x[0]}</b><span>${x[1]}</span></div>`).join("");

/* ---- map state ---- */
let minLat=90,maxLat=-90,minLon=180,maxLon=-180;
for(const p of S){minLat=Math.min(minLat,p[0]);maxLat=Math.max(maxLat,p[0]);minLon=Math.min(minLon,p[1]);maxLon=Math.max(maxLon,p[1])}
const kx=Math.cos(((minLat+maxLat)/2)*Math.PI/180);
let view={cx:(minLon+maxLon)/2,cy:(minLat+maxLat)/2,sc:1};
function size(){const r=devicePixelRatio||1;cv.width=cv.clientWidth*r;cv.height=cv.clientHeight*r;ctx.setTransform(r,0,0,r,0,0)}
function fit(){const w=cv.clientWidth,h=cv.clientHeight;view.sc=Math.min(w/((maxLon-minLon)*kx*1.08),h/((maxLat-minLat)*1.08));view.cx=(minLon+maxLon)/2;view.cy=(minLat+maxLat)/2;draw()}
function px(lat,lon){return[(lon-view.cx)*kx*view.sc+cv.clientWidth/2,(view.cy-lat)*view.sc+cv.clientHeight/2]}
function zoomAt(mx,my,f){const w=cv.clientWidth,h=cv.clientHeight;const lon=view.cx+(mx-w/2)/(kx*view.sc),lat=view.cy-(my-h/2)/view.sc;view.sc*=f;view.cx=lon-(mx-w/2)/(kx*view.sc);view.cy=lat+(my-h/2)/view.sc;draw()}
function focus(lat,lon,sc){view.cx=lon;view.cy=lat;if(sc)view.sc=Math.max(view.sc,sc);draw()}

/* ---- side controls ---- */
const layerDefs=[["osm","OpenStreetMap posted limit (road colour)",SM.has_osm],["low","Slower driving (context)",true],["sec","Outline the 105 sections",true],["fl","Flips between 100 and 110",D.fl.length>0],["sl","TomTom shortlist (A / B / C)",D.sl.length>0],["pl","Place names (zoom in)",D.g.length>0]];
$("layers").innerHTML=layerDefs.filter(d=>d[2]).map(d=>`<label class="chip"><input type="checkbox" data-l="${d[0]}" ${st.L[d[0]]?"checked":""}> ${d[1]}</label>`).join("");
$("layers").onchange=e=>{st.L[e.target.dataset.l]=e.target.checked;draw()};
function renderFilters(){
 const cmp=st.view==="cmp";$("fh").textContent=cmp?"Show (comparison classes)":"Show (speed bands)";
 const items=cmp?CAT.map((c,i)=>[i,c[0],`var(--k${i})`,ccount[i],st.fc[i]]):BANDN.map((n,i)=>[i,n,`var(--c${i})`,bcount[i],st.fb[i]]);
 $("filt").innerHTML=items.map(x=>`<label class="chip" title="${cmp?esc(CAT[x[0]][1]):""}"><input type="checkbox" data-i="${x[0]}" ${x[4]?"checked":""}><span class="sw ${cmp&&x[0]===3?"dash":""}" style="border-color:${x[2]}"></span><span>${esc(x[1])}</span><span class="n">${x[3]}</span></label>`).join("");
 $("filt").onchange=e=>{const i=+e.target.dataset.i;(cmp?st.fc:st.fb)[i]=e.target.checked?1:0;draw()};
 renderLegend()}
function renderLegend(){const cmp=st.view==="cmp";let h="";
 if(cmp){h+=`<div class="li"><span class="sw" style="border-color:var(--k1);border-top-width:5px"></span>105 on an OSM 110 road</div><div class="li"><span class="sw" style="border-color:var(--k2)"></span>Standard 100 on an OSM 110 road</div><div class="li"><span class="sw dash" style="border-color:var(--k3)"></span>110/115 on an OSM 100 road</div><div class="li"><span class="sw" style="border-color:var(--k0)"></span>Agrees with OpenStreetMap</div>`}
 else{h+=BANDN.map((n,i)=>`<div class="li"><span class="sw" style="border-color:var(--c${i})"></span>${n.split(" (")[0]}</div>`).join("")}
 if(st.L.osm)h+=`<div class="li"><span class="sw casing" style="background:var(--o110)"></span>OSM road 110 &nbsp;<span class="sw casing" style="background:var(--o100)"></span>100 &nbsp;<span class="sw casing" style="background:var(--ooth)"></span>other</div>`;
 if(st.L.fl)h+=`<div class="li"><span class="sw tri"></span>flip 100&rarr;110 (&#9650;) or 110&rarr;100 (&#9660;); filled = OSM 110 both sides</div>`;
 $("legend").innerHTML=h}
$("seg").onclick=e=>{const v=e.target.dataset.v;if(!v)return;st.view=v;[...$("seg").children].forEach(b=>b.classList.toggle("on",b.dataset.v===v));renderFilters();draw()};
$("dates").innerHTML=days.map(d=>`<label class="on" title="${d}" data-d="${d}">${d.replace(/^\w+ /,"")}</label>`).join("");
$("dates").onclick=e=>{const d=e.target.dataset.d;if(!d)return;st.dayOn[d]=!st.dayOn[d];e.target.classList.toggle("on",st.dayOn[d]);draw()};
$("zin").onclick=()=>zoomAt(cv.clientWidth/2,cv.clientHeight/2,1.5);$("zout").onclick=()=>zoomAt(cv.clientWidth/2,cv.clientHeight/2,1/1.5);$("fit").onclick=fit;

/* ---- drawing ---- */
function wayColor(l){return l===110?css("--o110"):l===100?css("--o100"):css("--ooth")}
function draw(){const w=cv.clientWidth,h=cv.clientHeight;ctx.clearRect(0,0,w,h);ctx.lineCap="round";ctx.lineJoin="round";
 const vis=(a,b)=>!(a[0]<-30&&b[0]<-30||a[0]>w+30&&b[0]>w+30||a[1]<-30&&b[1]<-30||a[1]>h+30&&b[1]>h+30);
 if(st.L.osm&&SM.has_osm){ctx.globalAlpha=.3;ctx.lineWidth=Math.max(7,Math.min(14,view.sc/900));
  for(const wy of W){if(wy.p.length<2)continue;ctx.strokeStyle=wayColor(wy.l);ctx.beginPath();let first=true,prev=null;
   for(const q of wy.p){const a=px(q[0],q[1]);if(first){ctx.moveTo(a[0],a[1]);first=false}else ctx.lineTo(a[0],a[1])}ctx.stroke()}
  ctx.globalAlpha=1}
 const cmp=st.view==="cmp";let prev=null,pi=-1;
 for(let i=0;i<S.length;i++){const p=S[i],q=prev,qi=pi;prev=p;pi=i;if(!q||q[5]!==p[5]||p[4]-q[4]>150)continue;
  if(!st.dayOn[dayOf(i)])continue;const hw=p[2]>=85&&q[2]>=85;if(!hw&&!st.L.low)continue;
  const a=px(q[0],q[1]),b=px(p[0],p[1]);if(!vis(a,b))continue;
  if(!hw){ctx.strokeStyle=css("--k4");ctx.lineWidth=1.5;ctx.globalAlpha=.5;ctx.setLineDash([]);ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.stroke();ctx.globalAlpha=1;continue}
  let col,lw=3,dash=[],under=false;
  if(cmp){const c=C[i];if(!st.fc[c])continue;col=css("--k"+c);lw=c===1?5:c===0?3:c===5?1.5:4;if(c===3)dash=[7,4];under=c===1}
  else{if(!st.fb[p[6]])continue;col=css("--c"+p[6])}
  if(under){ctx.strokeStyle=css("--fg");ctx.globalAlpha=.55;ctx.lineWidth=lw+3;ctx.setLineDash([]);ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.stroke();ctx.globalAlpha=1}
  ctx.strokeStyle=col;ctx.lineWidth=lw;ctx.setLineDash(dash);ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.stroke();ctx.setLineDash([])}
 if(st.L.sec){ctx.lineWidth=1;ctx.strokeStyle=css("--fg");for(const s of D.sec){const a=px(s.lat,s.lon),b=px(s.lat1,s.lon1);ctx.globalAlpha=.3;ctx.beginPath();ctx.arc((a[0]+b[0])/2,(a[1]+b[1])/2,Math.min(18,Math.max(6,Math.hypot(a[0]-b[0],a[1]-b[1])/2+4)),0,7);ctx.stroke()}ctx.globalAlpha=1}
 if(st.L.fl){for(const f of D.fl){if(f.i!=null&&S[f.i]&&!st.dayOn[dayOf(f.i)])continue;const a=px(f.lat,f.lon);if(a[0]<-10||a[0]>w+10||a[1]<-10||a[1]>h+10)continue;
  const up=f.k==="100->110",r=view.sc>4000?7:5;ctx.beginPath();if(up){ctx.moveTo(a[0],a[1]-r);ctx.lineTo(a[0]+r,a[1]+r*.8);ctx.lineTo(a[0]-r,a[1]+r*.8)}else{ctx.moveTo(a[0],a[1]+r);ctx.lineTo(a[0]+r,a[1]-r*.8);ctx.lineTo(a[0]-r,a[1]-r*.8)}ctx.closePath();
  ctx.fillStyle=f.c==="OSM 110 both sides"?css("--k1"):css("--card");ctx.fill();ctx.strokeStyle=css("--fg");ctx.lineWidth=1.2;ctx.stroke()}}

<table><thead><tr><th>Date</th><th>Time</th><th>From</th><th>To</th><th>Length</th><th>Average</th><th>Speed mix</th><th>OSM 110 / 100</th><th>Flips</th></tr></thead><tbody>${D.st.map((t,i)=>`<tr class="row" data-i="${i}"><td>${t.date.slice(5)}</td><td>${t.t0}-${t.t1}</td><td>${esc(t.frm)}</td><td>${esc(t.to)}</td><td>${t.km} km</td><td>${t.avg}</td><td>${bar([[t.b[0],"var(--c0)","standard 100 "+t.b[0]+"%"],[t.b[1],"var(--c1)","hurry/105 "+t.b[1]+"%"],[t.b[2],"var(--c2)","standard 110 "+t.b[2]+"%"],[t.b[3],"var(--c3)","hurry 115 "+t.b[3]+"%"],[t.b[4],"var(--c4)","other "+t.b[4]+"%"]])}</td><td>${t.m?pct(t.o110,t.m)+"% / "+pct(t.o100,t.m)+"%":"-"}</td><td>${t.sw}</td></tr>`).join("")}</tbody></table>`;
$("p-st").onclick=e=>{const tr=e.target.closest("tr.row");if(!tr)return;const t=D.st[+tr.dataset.i];if(!t.ix)return;const a=S[t.ix[0]],b=S[t.ix[1]];st.sel=null;select({t:"st",o:t});
 const lat=(a[0]+b[0])/2,lon=(a[1]+b[1])/2;const w=cv.clientWidth,h=cv.clientHeight;view.cx=lon;view.cy=lat;view.sc=Math.min(w/(Math.abs(b[1]-a[1])*kx*1.3+1e-4),h/(Math.abs(b[0]-a[0])*1.3+1e-4),20000);draw();window.scrollTo({top:0,behavior:"smooth"})};
// calibration
const bn=["Standard in a 100","Hurry in a 100 (105)","Standard in a 110","Hurry in a 110"];
$("p-cal").innerHTML=`<h3>How well OpenStreetMap agrees with what you drove</h3><p class="note">Each row is a speed band the car ran at on a highway; each cell is the share of those samples on a road with that OpenStreetMap limit. Standard mode (rows 1 and 3) is the best proxy for the signed limit. The 105 row is the question: if it sits mostly on OSM 110, the car read a 110 road as 100.</p>
<table class="heat"><thead><tr><th>Car speed band</th><th>OSM 110</th><th>OSM 100</th><th>Other limit (80, 90...)</th><th>No limit tag</th><th>Samples</th></tr></thead><tbody>${D.cal.map((r,i)=>{const t=r.reduce((a,b)=>a+b,0);return `<tr><td>${bn[i]}</td>${r.map((v,j)=>`<td class="h" style="background:color-mix(in srgb,${j===0?"var(--o110)":j===1?"var(--o100)":"var(--ooth)"} ${Math.round(70*v/(t||1))}%,transparent)">${pct(v,t)}% <small>(${v})</small></td>`).join("")}<td class="h">${t}</td></tr>`}).join("")}</tbody></table>
<p class="note">Flips: ${SM.flips} changes of the car's 100/110 reading; ${SM.flips_in110} have OpenStreetMap at 110 on both sides, and only ${SM.flips_osm_changes} coincide with OpenStreetMap changing limit the same way. Match rate: ${SM.matched.toLocaleString()} of ${SM.hw.toLocaleString()} highway samples matched to an OSM road.</p>`;
// how-to
$("p-how").innerHTML=`<h3>Checking a point in TomTom MapShare</h3><ol class="how"><li>Open the <b>TomTom</b> link from a row or the Selected card. MapShare opens at zoom 17 centred on that GPS point. Sign in first; MapShare will ask you to sign in when you click the map.</li>
<li>Note the heading. In Australia traffic keeps left, so on a divided road <b>northbound is the west carriageway, southbound east, eastbound north, westbound south</b>. The two carriageways are only about 15-25 m (20-35 px) apart.</li>
<li>Click on the carriageway line, within 1-2 px of it. The map re-centres after each click and the centre marker swallows clicks, so centre the map about 40 m behind the point and click about 57 px ahead along the road. A hit highlights a segment (180 m or more) in blue.</li>
<li>Choose <b>Speed Limit</b>. The form is pre-filled with TomTom's stored limit for that segment and shows the direction it applies to. Read it, then close the form with the X. Do not press Submit unless you mean to report a change.</li>
<li>A segment can be long, and a flip sits within ~0.9 km of two samples, so check the segments on both sides of the flip.</li>
<li>If TomTom shows <b>100</b> and you believe it is 110, use the Street View link (look forward along the direction travelled, just before where the car changed) to find the sign. If TomTom already shows 110, the car's 100 does not come from TomTom's data.</li></ol>
<p class="note">Checked so far (nothing submitted): M1 Pacific Motorway at Wahroonga northbound = 110 on two segments; Pacific Highway south of Coffs Harbour southbound (A5) = 110; control, Maryborough-Hervey Bay Road = 100.</p>`;

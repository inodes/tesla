<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dashcam flip review</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
:root{--bg:#f7f7f5;--card:#fff;--ink:#1c1f23;--mut:#5b636d;--line:#dcdfe3;--acc:#0072B2;--ok:#1b7f5c;--okbg:#e2f3ec;--warn:#9a5b00;--warnbg:#fdf0d8;--bad:#b23a00;--badbg:#fbe5da;--chip:#eef0f3;--grid:#e6e8eb;--shade:rgba(213,94,0,.16);--ind:#c26a00;--spd:#0072B2;--brk:#b23a00;--lim:#8a929c;--sr:#c0281e;--sy:#d9a400;--sb:#1f5fbf;--sw:#f4f4f1;--sp:#7a3fb5;--sg:#1f9d55}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15181b;--card:#1d2125;--ink:#e8eaed;--mut:#a3abb5;--line:#323840;--acc:#56b4e9;--ok:#5fd1a4;--okbg:#17352b;--warn:#f0b25c;--warnbg:#3a2c12;--bad:#ff9a66;--badbg:#3d2316;--chip:#2a3036;--grid:#2c3238;--shade:rgba(240,120,40,.22);--spd:#56b4e9;--brk:#ff9a66;--lim:#7b838d;--sr:#e5574c;--sy:#f2c230;--sb:#4d8ef0;--sw:#e9e9e6;--sp:#b58cf0;--sg:#34c77b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15181b;--card:#1d2125;--ink:#e8eaed;--mut:#a3abb5;--line:#323840;--acc:#56b4e9;--ok:#5fd1a4;--okbg:#17352b;--warn:#f0b25c;--warnbg:#3a2c12;--bad:#ff9a66;--badbg:#3d2316;--chip:#2a3036;--grid:#2c3238;--shade:rgba(240,120,40,.22);--spd:#56b4e9;--brk:#ff9a66;--lim:#7b838d;--sr:#e5574c;--sy:#f2c230;--sb:#4d8ef0;--sw:#e9e9e6;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.wrap{max-width:1360px;margin:0 auto;padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1{font-size:22px;margin:0 0 4px}
.sub{color:var(--mut);max-width:900px;margin:0 0 14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.kpi b{display:block;font-size:24px;line-height:1.1}
.kpi span{color:var(--mut);font-size:13px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:8px 0;border-bottom:1px solid var(--line);margin-bottom:12px;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.bar label{font-size:13px;color:var(--mut);display:flex;gap:6px;align-items:center}
select,button,input,textarea{font:inherit;color:var(--ink)}
select{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:4px 6px}
.btn{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:4px 10px;cursor:pointer}
.btn:hover{border-color:var(--acc)}
.count{margin-left:auto;color:var(--mut);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:14px;content-visibility:auto;contain-intrinsic-size:auto 900px}
.head{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-bottom:10px}
.head .id{font-weight:700}
.head .when{color:var(--mut)}
.chip{display:inline-block;border-radius:999px;padding:2px 9px;font-size:12.5px;background:var(--chip);white-space:nowrap}
.chip.ok{background:var(--okbg);color:var(--ok)} .chip.warn{background:var(--warnbg);color:var(--warn)} .chip.bad{background:var(--badbg);color:var(--bad)}
.top{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:14px;margin-bottom:10px;align-items:start}
@media (max-width:860px){.top{grid-template-columns:1fr}}
.film{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
@media (max-width:700px){.film{grid-template-columns:repeat(3,minmax(0,1fr))}}
.cell{position:relative;border:3px solid transparent;border-radius:6px;padding:0;cursor:zoom-in;background-color:#222;background-repeat:no-repeat;background-size:calc(var(--cols,5)*100%) calc(var(--rows,5)*100%);overflow:hidden}
.film.on .cell:not(.nodata){background-image:var(--sheet)}
.cell .fbar{position:absolute;left:0;right:0;bottom:0;height:5px}
.cell .lab{bottom:5px}
.cell.nodata{background:#2b2b2b;cursor:default;border-color:var(--line)}
.cell .lab{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.62);color:#fff;font-size:11.5px;padding:1px 5px;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell.onset{box-shadow:0 0 0 2px var(--ink)}
.cell:hover,.cell:focus-visible{border-color:var(--acc)}
.nosheet{display:flex;align-items:center;justify-content:center;min-height:120px;background:var(--chip);border-radius:8px;color:var(--mut);font-size:13px;padding:8px;text-align:center}
.chart svg{width:100%;height:auto;display:block}
.chart svg{cursor:crosshair;touch-action:pan-y}
#ctip{position:fixed;z-index:60;pointer-events:none;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:8px;box-shadow:0 4px 16px rgba(0,0,0,.22);padding:8px 10px;font-size:12.5px;line-height:1.45;max-width:280px}
#ctip b{font-size:13px}#ctip .k{color:var(--mut)}
.key{margin-top:14px;padding-top:10px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:var(--ink)}
.key div{display:flex;flex-wrap:wrap;align-items:center;gap:4px 16px}
.key b{min-width:52px;color:var(--mut);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em}
.key i{display:inline-block;width:14px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.key em{color:var(--mut);font-style:normal;font-size:11.5px}
.tk{stroke:var(--mut);stroke-width:.8;opacity:.55}
.tk.hot{stroke:var(--acc);stroke-width:2.4;opacity:1}
.facts{font-size:13.5px;color:var(--ink);margin:6px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:5px}
.facts .k{display:inline-block;min-width:78px;color:var(--mut);font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.facts a{color:var(--acc)}
.rev{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.rev .opt{border:1px solid var(--line);border-radius:999px;padding:3px 11px;cursor:pointer;background:var(--card);font-size:13px}
.rev .opt.on{background:var(--acc);border-color:var(--acc);color:#fff}
.rev input[type=text]{flex:1;min-width:160px;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:4px 8px;font-size:13px}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:20;gap:8px;padding:8px}
.lb[hidden]{display:none}
.lb .stage{display:flex;align-items:center;gap:8px;max-width:100%}
.lb .big{background-repeat:no-repeat;background-color:#111;border-radius:6px;background-size:calc(var(--cols,5)*100%) calc(var(--rows,5)*100%)}
.lb .nav{background:rgba(255,255,255,.14);color:#fff;border:0;border-radius:50%;width:42px;height:42px;font-size:22px;cursor:pointer;flex:none}
.lb .nav:hover{background:rgba(255,255,255,.3)}
.lb .cap{color:#fff;font-size:14px;text-align:center;max-width:1100px}
.lb a{color:#9fd3ff}
.panel{background:var(--card);color:var(--ink);border-radius:10px;padding:14px;width:min(640px,92vw);display:flex;flex-direction:column;gap:8px}
.panel textarea{width:100%;font:12px/1.4 ui-monospace,Menlo,monospace;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:6px}
.panel p{margin:0;color:var(--mut);font-size:13px}
.opt.ag{border-color:var(--ok);color:var(--ok);font-weight:600}.opt.ag.on{background:var(--ok);color:var(--bg)}
.cell .ind{position:absolute;top:4px;background:var(--ind);color:#fff;font-size:15px;font-weight:700;line-height:1;padding:4px 7px;border-radius:5px;box-shadow:0 0 0 2px rgba(0,0,0,.55)}
.cell .ind.l{left:4px}.cell .ind.r{right:4px}
.sgs{position:absolute;left:4px;bottom:24px;display:flex;gap:4px;align-items:flex-end;pointer-events:none}
.sg{display:inline-flex;align-items:center;justify-content:center;box-shadow:0 0 0 2px rgba(0,0,0,.45);font-family:system-ui,sans-serif;font-weight:800}
.sg.sp{width:36px;height:36px;border-radius:50%;background:#fff;border:4px solid #d1190f;color:#000;font-size:13px;letter-spacing:-.5px;box-sizing:border-box}
.sg.wn{width:34px;height:30px;background:#f5c400;color:#000;font-size:17px;clip-path:polygon(50% 0,100% 100%,0 100%);align-items:flex-end;padding-bottom:2px;box-shadow:none;filter:drop-shadow(0 0 1px #000)}
.sg.bl{min-width:30px;height:24px;padding:0 5px;background:#1f5fbf;color:#fff;font-size:14px;border-radius:4px;border:2px solid #fff}
.sg.wh{min-width:30px;height:22px;padding:0 5px;background:#fff;color:#222;font-size:11px;border-radius:3px;border:2px solid #777}
.sg.gr{min-width:30px;height:24px;padding:0 5px;background:#13803f;color:#fff;font-size:13px;border-radius:3px;border:2px solid #fff}
.sg.tr{min-width:30px;height:24px;background:#7a3fb5;color:#fff;font-size:15px;border-radius:5px;border:2px solid #fff}
.card.bug{border-left:6px solid var(--bad)}
.how{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:14px;color:var(--mut);font-size:13.5px}
.how b{color:var(--ink)}
.signs{margin:8px 0 2px;font-size:13px}.signs img{max-width:100%;height:auto;margin-top:6px;border-radius:6px;image-rendering:auto}.signs .mut{color:var(--mut)}
</style>
</head>
<body>
<div class="wrap">
<h1>Dashcam flip review</h1>
<p class="sub" id="sub"></p>
<div class="kpis" id="kpis"></div>
<div class="sub" id="sync"></div>
<div class="how"><b>Each card:</b> speed chart, then one still a second. Green border = FSD on. Click a still to enlarge it (arrow keys step). Then pick <b>Your call</b>.</div>
<div class="bar" id="bar"></div>
<div id="list"></div>
</div>
<div class="lb" id="exp" hidden><div class="panel"><b>Your reviews (CSV)</b><p>Only events you marked or noted are listed. Copy this into a file or send it to Claude.</p><textarea id="expta" rows="10" readonly></textarea><div><button class="btn" id="expcopy">Copy</button> <button class="btn" id="expclose">Close</button> <span id="expmsg"></span></div></div></div>
<div class="lb" id="lb" hidden><div class="stage"><button class="nav" id="prev" aria-label="Previous second">‹</button><div class="big" id="big"></div><button class="nav" id="next" aria-label="Next second">›</button></div><div class="cap" id="cap"></div></div>
<script>
const DATA=/*DATA*/null;
const E=DATA.e,SM=DATA.s;
const COLS=SM.cols||5,ROWS=SM.rows||4;document.documentElement.style.setProperty("--cols",COLS);document.documentElement.style.setProperty("--rows",ROWS);
const $=s=>document.querySelector(s);
const CATS=[["sign100","Real lower-limit sign (100 or less)"],["roadworks","Road works / variable speed"],["traffic","Traffic, exit or curve"],["sign110","110 sign, car slowed anyway"],["nosign","No sign, car changed anyway"],["othersign","Sign for another road (e.g. no entry)"],["bluesign","Blue/white sign (camera, check speed...)"],["bugovertake","FSD bug: slowed right after an overtake"],["up110","Speed-up: 110 sign seen"],["uptraffic","Speed-up: traffic ahead cleared"],["upnosign","Speed-up: no sign before it"],["unclear","Unclear"]];
// "Agree with sign check" stores c="agree"; effCall() turns it into the category implied by the automatic sign check
const AGREE={"100":"sign100","other-limit":"sign100","110-at":"sign110","110-before":"sign110","roadworks":"roadworks","other-road":"othersign","blue-sign":"bluesign","overtake":"bugovertake","other":"traffic","none":"nosign"};
// speed-ups (100 -> 110) read differently: a 110 sign is the genuine reason, so they have their own categories
const AGREE_UP={"110":"up110","110-before":"up110","110-after":"upnosign","other-limit":"upnosign","other":"uptraffic","none":"upnosign","roadworks":"roadworks","blue-sign":"bluesign","other-road":"othersign"};
const agreeOf=e=>e.sign?((e.step.kind==="rise"?AGREE_UP:AGREE)[e.sign.read]||""):"";
const effCall=e=>{const c=REV[e.id]&&REV[e.id].c;return c==="agree"?agreeOf(e):(c||"")};
const KEY="dfr:v1:";
// Your calls: saved in the artifact's shared database (kept across republishes, readable by Claude), with a
// copy in this browser and the dashcam_flip_reviews.json that the builder embeds (so new pages start with them).
const FT={};E.forEach(e=>FT[e.id]=e.flip_time);
const okRev=(id,r)=>r&&FT[id]&&(!r.ft||r.ft===FT[id]);
let REV={};
Object.entries(DATA.r||{}).forEach(([id,r])=>{if(okRev(id,r))REV[id]=r});
try{E.forEach(e=>{const r=localStorage.getItem(KEY+e.id);if(r){const v=JSON.parse(r);if(v&&(v.c||v.n))REV[e.id]=v}})}catch(_){}
let DB=null;
function setSync(t,bad){const el=document.getElementById("sync");if(el){el.textContent=t;el.style.color=bad?"var(--bad)":"var(--mut)"}}
const _tm={};
function pushRev(id){if(!DB)return;clearTimeout(_tm[id]);_tm[id]=setTimeout(()=>{const r=REV[id]||{};
  DB.collection("reviews").doc(id).set({c:r.c||null,n:r.n||"",ft:FT[id],at:r.at||Date.now()}).then(()=>setSync("Your calls are saved to the shared store.")).catch(()=>setSync("Could not save to the shared store - kept in this browser only.",1))},500)}
function saveRev(id){const r=REV[id]=REV[id]||{};r.ft=FT[id];r.at=Date.now();try{localStorage.setItem(KEY+id,JSON.stringify(r))}catch(_){}pushRev(id)}
function paintRev(){document.querySelectorAll(".rev").forEach(b=>{const r=REV[b.dataset.id]||{};b.querySelectorAll(".opt").forEach(o=>o.classList.toggle("on",o.dataset.c===r.c));const i=b.querySelector("input");if(i&&document.activeElement!==i)i.value=r.n||""});kpis()}
(async()=>{try{if(typeof claude==="undefined")return;const c=await claude.use("db");if(!c){setSync("Your calls are kept in this browser only.");return}
  DB=c;let first=true;
  c.collection("reviews").onSnapshot(snap=>{const seen={};
    snap.docs.forEach(d=>{const r=d.data()||{};seen[d.id]=1;if(!okRev(d.id,r)||d.metadata.hasPendingWrites)return;REV[d.id]={c:r.c||null,n:r.n||"",ft:r.ft,at:r.at};try{localStorage.setItem(KEY+d.id,JSON.stringify(REV[d.id]))}catch(_){}});
    if(first){first=false;Object.keys(REV).forEach(id=>{if(!seen[id]&&(REV[id].c||REV[id].n))pushRev(id)})}   // first load: copy browser/seed calls into the store
    paintRev();setSync("Your calls are saved to the shared store.")},()=>setSync("Shared store unavailable - kept in this browser only.",1))
}catch(_){setSync("Your calls are kept in this browser only.")}})();
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const srcText=e=>{const c=e.clip_event;if(e.clip_src==="recent")return"Recent clip";
  const k=e.clip_src==="saved"?"Saved":"Sentry";if(!c)return k;
  return k+": "+c.label+(c.time?" at "+c.time:"")+(c.rel!=null?` (${c.rel>=0?c.rel+" s after":-c.rel+" s before"})`:"")+(c.place?", "+c.place:"")};
const srcChip=e=>e.clip_src==="recent"?"":chip(e.clip_event&&e.clip_event.reason==="vehicle_auto_emergency_braking"?"bad":"",esc(e.clip_src==="saved"?"saved clip":"Sentry clip")+(e.clip_event?": "+esc(e.clip_event.label):""));
const marksOf=e=>(e.marks_auto||[]).concat((e.sign&&e.sign.marks)||[]).concat(((e.sign&&e.sign.blue)||[]).map(b=>({k:"blue",t0:b.t-.5,t1:b.t+.5,text:b.text})));
const dvCol=d=>d<=-3?"#e0201b":d<=-1.2?"#ff7a1a":d<=-0.4?"#ffc14d":d<0.4?"#7b8490":d<1.2?"#8cc2ff":d<3?"#3b8cff":"#0a5bd6";
function sgBadges(e,rel){const a=marksOf(e).filter(q=>rel>=q.t0-.5&&rel<=q.t1+.5);if(!a.length)return"";
  const seen={};return `<span class="sgs">`+a.map(q=>{const k=q.k+(q.k==="speed"?q.text.replace(/ .*/,""):"");if(seen[k])return"";seen[k]=1;
    const tt=` title="${esc(q.text)}"`;
    if(q.k==="speed")return `<span class="sg sp"${tt}>${esc(q.text.replace(/ .*/,"").slice(0,3))}</span>`;
    if(q.k==="warn")return `<span class="sg wn"${tt}>!</span>`;
    if(q.k==="blue")return `<span class="sg bl"${tt}>i</span>`;
    if(q.k==="green")return `<span class="sg gr"${tt}>▭</span>`;
    if(q.k==="white")return `<span class="sg wh"${tt}>sign</span>`;
    return `<span class="sg tr"${tt}>🚗</span>`}).join("")+`</span>`}
const f1=x=>x==null?"?":(Math.round(x*10)/10).toFixed(1);
const day=e=>e.onset_local.slice(0,10);
const apName=a=>({0:"not engaged",1:"FSD",2:"Autosteer",3:"TACC"}[a]||"?");
const sgn=r=>(r>0?"+":r<0?"−":"")+Math.abs(r);

function stepText(e){
  const s=e.step;
  if(s.kind==="none")return `no speed change in the video (${f1(s.pre)} km/h)`;
  let t=`${f1(s.pre)} → ${f1(s.post)} km/h (${s.delta>0?"+":""}${f1(s.delta)}) over ${s.secs} s`;
  // the slowdown can carry on after the first step: report where the speed ends up within the stills
  const vs=e.frames.filter(f=>f.v!=null&&f.rel>0);
  if(vs.length&&s.kind==="drop"){const lo=vs.reduce((a,b)=>b.v<a.v?b:a);if(lo.v<s.post-3)t+=`, then on to ${f1(lo.v)} km/h by ${sgn(lo.rel)} s (${f1(lo.v-s.pre)} in all)`}
  return t;
}
const bkG=b=>b===1?"◀":b===2?"▶":b===3?"◀▶":"";
function indText(e){
  const r=e.indicator||[];if(!r.length)return"";
  return r.map(x=>`${x.side==="L"?"left":x.side==="R"?"right":"hazard"} indicator ${sgn(x.t0)} to ${sgn(x.t1)} s`).join("; ");
}
function cruiseText(e){
  const c=e.cruise;if(!c||c.pre==null)return"";
  const o=v=>(v>0?"+":v<0?"−":"±")+Math.abs(v).toFixed(1);
  let t=`Cruise before the change ${f1(c.pre)} km/h (110 limit ${o(c.pre_vs_110)})`;
  if(c.post_vs_100!=null)t+=`, then ${f1(c.post)} km/h (100 limit ${o(c.post_vs_100)})`;
  if(c.steady!=null&&Math.abs(c.steady-c.pre)>=0.8)t+=`; steady speed in the minute before ${f1(c.steady)} (${o(c.steady-110)})`;
  return t+". Dashcam speed is the car's own reading; the dash can show a few km/h more.";
}
function cruiseShort(e){
  const c=e.cruise;if(!c||c.pre==null||e.flip_kind!=="110->100")return"";
  const o=v=>(v>0?"+":v<0?"−":"±")+Math.abs(v).toFixed(1);
  return `before ${f1(c.pre)} (110 ${o(c.pre_vs_110)})`+(c.post_vs_100!=null?` · after ${f1(c.post)} (100 ${o(c.post_vs_100)})`:"");
}
function chip(c,t){return `<span class="chip ${c}">${t}</span>`}
function chart(e){
  const W=620,H=294,L=44,R=8,T=14,B=122,s=e.ser;
  const vs=s.v.filter(v=>v!=null);let lo=Math.min(95,Math.floor((Math.min(...vs)-3)/5)*5),hi=Math.max(115,Math.ceil((Math.max(...vs)+3)/5)*5);
  const x=t=>L+(t-s.t0)/36*(W-L-R), y=v=>T+(hi-v)/(hi-lo)*(H-T-B);
  let o=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Speed around ${esc(e.id)}">`;
  for(let v=lo;v<=hi;v+=5){o+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)"/><text x="${L-4}" y="${y(v)+4}" text-anchor="end" font-size="12" fill="var(--mut)">${v}</text>`}
  [100,110].forEach(v=>{if(v>=lo&&v<=hi)o+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--lim)" stroke-dasharray="4 3"/>`});
  let a=null;for(let i=0;i<=s.ap.length;i++){const off=i<s.ap.length&&s.ap[i]!=="1"&&s.ap[i]!=="-";if(off&&a==null)a=i;if(!off&&a!=null){o+=`<rect x="${x(s.t0+a*s.dt)}" y="${T}" width="${Math.max(2,x(s.t0+i*s.dt)-x(s.t0+a*s.dt))}" height="${H-T-B}" fill="var(--shade)"/>`;a=null}}
  const SC={"1":"var(--ok)","2":"var(--warn)","3":"var(--warn)","0":"var(--bad)"};

$("#prev").onclick=ev=>{ev.stopPropagation();stepLB(-1)};
$("#next").onclick=ev=>{ev.stopPropagation();stepLB(1)};
document.addEventListener("click",ev=>{
  const o=ev.target.closest(".rev .opt");
  if(o){const id=o.parentNode.dataset.id;const r=REV[id]=REV[id]||{};r.c=r.c===o.dataset.c?null:o.dataset.c;saveRev(id);
    o.parentNode.querySelectorAll(".opt").forEach(b=>b.classList.toggle("on",b.dataset.c===r.c));kpis();return}
  const c=ev.target.closest(".cell[data-i]");
  if(c){showLB(E.find(x=>x.id===c.dataset.id),+c.dataset.i);return}
  if(ev.target.id==="lb"||ev.target.id==="big"||ev.target.classList.contains("stage"))$("#lb").hidden=true;
});
document.addEventListener("keydown",ev=>{
  if(ev.key==="Escape"){$("#lb").hidden=true;$("#exp").hidden=true}
  else if(ev.key==="ArrowRight")stepLB(1);else if(ev.key==="ArrowLeft")stepLB(-1);
});
document.addEventListener("input",ev=>{
  if(ev.target.matches(".rev input")){const id=ev.target.parentNode.dataset.id;const r=REV[id]=REV[id]||{};r.n=ev.target.value;saveRev(id)}
});

// hover the graph: crosshair + every state at that moment (speed, FSD, indicator, brake, signs seen, traffic)
const ctip=document.createElement("div");ctip.id="ctip";ctip.hidden=true;document.body.appendChild(ctip);
function chartHover(ev){
  const box=ev.target.closest&&ev.target.closest(".chart");if(!box){ctip.hidden=true;return}
  const svg=box.querySelector("svg"),e=E.find(x=>x.id===box.dataset.id);if(!svg||!e){return}
  const r=svg.getBoundingClientRect(),vb=svg.viewBox.baseVal,L=44,R=8,s=e.ser;
  const px=(ev.clientX-r.left)/r.width*vb.width;
  let line=svg.querySelector(".hx");
  if(px<L||px>vb.width-R){ctip.hidden=true;if(line)line.style.display="none";return}
  const t=s.t0+(px-L)/(vb.width-L-R)*36,i=Math.max(0,Math.min(s.v.length-1,Math.round((t-s.t0)/s.dt)));
  if(!line){line=document.createElementNS("http://www.w3.org/2000/svg","line");line.setAttribute("class","hx");line.setAttribute("stroke","var(--ink)");line.setAttribute("stroke-width","1");line.setAttribute("stroke-dasharray","3 3");line.setAttribute("y1",14);line.setAttribute("y2",vb.height-122);svg.appendChild(line)}
  line.style.display="";line.setAttribute("x1",px);line.setAttribute("x2",px);
  const rel=Math.round((s.t0+i*s.dt)*10)/10,v=s.v[i],ap=s.ap[i],bk=+(s.bk||"")[i]||0,br=s.br[i]==="1";
  const MK=marksOf(e);
  const NM={speed:"Limit sign",warn:"Warning",blue:"Blue sign",green:"Green location sign",white:"White sign",traffic:"Traffic in our lane"};
  const act=MK.filter(q=>rel>=q.t0-.25&&rel<=q.t1+.25);
  const still=e.frames.reduce((b,f,j)=>Math.abs(f.rel-rel)<Math.abs(e.frames[b].rel-rel)?j:b,0);
  let h=`<b>${sgn(rel)} s</b> · ${v==null?"no speed":f1(v)+" km/h"}<br><span class="k">FSD:</span> ${ap==="-"?"no data":ap==="1"?"on (FSD)":ap==="0"?"off (no assist)":apName(+ap)+" (not FSD)"}<br><span class="k">Indicator:</span> ${bk?bkG(bk)+(bk===1?" left":bk===2?" right":" both"):"off"}<br><span class="k">Brake:</span> ${br?"on":"off"}`;
  h+=act.length?"<br>"+act.map(q=>`<span class="k">${NM[q.k]||q.k}:</span> ${esc(q.text)}`).join("<br>"):`<br><span class="k">Signs / traffic:</span> none noted`;
  h+=`<br><span class="k">Nearest still:</span> ${still+1} of ${e.frames.length}`;
  ctip.innerHTML=h;ctip.hidden=false;
  const w=ctip.offsetWidth,hh=ctip.offsetHeight;let X=ev.clientX+16,Y=ev.clientY+14;
  if(X+w>innerWidth-8)X=ev.clientX-w-16;if(Y+hh>innerHeight-8)Y=innerHeight-hh-8;ctip.style.left=Math.max(8,X)+"px";ctip.style.top=Math.max(8,Y)+"px";
}
document.addEventListener("pointermove",chartHover);
document.addEventListener("pointerleave",()=>{ctip.hidden=true});
document.addEventListener("pointerdown",ev=>{if(!ev.target.closest||!ev.target.closest(".chart"))ctip.hidden=true});
// hover a still: highlight its moment on the chart
function hot(ev,on){const c=ev.target.closest&&ev.target.closest(".cell[data-i]");if(!c)return;
  const t=c.closest(".card").querySelector(`.tk[data-i="${c.dataset.i}"]`);if(t)t.classList.toggle("hot",on)}
document.addEventListener("mouseover",ev=>hot(ev,true));
document.addEventListener("mouseout",ev=>hot(ev,false));
if(E.length){setup();render()}else{$("#list").innerHTML='<p class="sub">No events yet.</p>'}
</script>
</body>

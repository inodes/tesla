name: CI Quality & Syntax Audit

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    name: Syntax & Sanity Checks
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate Shell Script Syntax
        run: |
          echo "Checking syntax of Tools/dashcam_exportdash.sh..."
          bash -n Tools/dashcam_exportdash.sh
          
          echo "Checking syntax of Tools/dashcam_sync.sh..."
          zsh -n Tools/dashcam_sync.sh

      - name: Verify CLI Help & Flags
        run: |
          chmod +x Tools/dashcam_sync.sh Tools/dashcam_exportdash.sh Tools/*.py
          ./Tools/dashcam_sync.sh --help
          ./Tools/dashcam_sync.sh --doctor || true
          ./Tools/dashcam_exportdash.sh --help
          ./Tools/tessie_drives_analyzer.py --help
          ./Tools/tessie_charging_analyzer.py --help
          ./Tools/tessie_places.py --help
          ./Tools/charger_find_tesla.py --help

      - name: Verify Embedded Python Scripts
        run: |
          for f in Tools/*.py; do
            echo "Compiling $f..."
            python3 -m py_compile "$f"
          done

name: CI Quality & Syntax Audit

on:
  push:
    branches: [ main, merged ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, merged ]

jobs:
  validate:
    name: Syntax & Sanity Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install what the tests use
        # only what the tests import; the optional pieces (timezonefinder, osmium, evnex, pvlib) are not needed: tests that use them skip
        run: python3 -m pip install numpy scipy pandas matplotlib pypdf opencv-python-headless

      - name: Every Python file compiles
        run: |
          find Tools tests -name '*.py' -print0 | xargs -0 python3 -m py_compile

      - name: The app's page script parses
        run: node --check Tools/lib/app_ui/app.js

      - name: Tests
        env:
          TESLA_CONFIG: config.example.json
          TESLA_DATA_DIR: /tmp/nodata
        run: |
          python3 -m unittest discover -s tests -p "test_[a-h]*.py"
          python3 -m unittest discover -s tests -p "test_[i-r]*.py"
          python3 -m unittest discover -s tests -p "test_[s-z]*.py"

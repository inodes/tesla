name: CI Quality & Syntax Audit

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    name: Syntax & Sanity Checks
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate Shell Script Syntax
        run: |
          echo "Checking syntax of Tools/run_exportdash.sh..."
          bash -n Tools/run_exportdash.sh
          
          echo "Checking syntax of Tools/tesla_sync.sh..."
          zsh -n Tools/tesla_sync.sh

      - name: Verify CLI Help & Flags
        run: |
          chmod +x Tools/tesla_sync.sh Tools/run_exportdash.sh Tools/tessie_analyzer.py Tools/tessie_renamer.py
          ./Tools/tesla_sync.sh --help
          ./Tools/tesla_sync.sh --doctor || true
          ./Tools/run_exportdash.sh --help
          ./Tools/tessie_analyzer.py --help
          ./Tools/tessie_renamer.py --help

      - name: Verify Embedded Python Scripts
        run: |
          python3 -c "import ast; print('Python 3 AST compiler ready')"

name: CI Quality & Syntax Audit

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    name: Syntax & Sanity Checks
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate Shell Script Syntax
        run: |
          echo "Checking syntax of run_exportdash.sh..."
          bash -n run_exportdash.sh
          
          echo "Checking syntax of tesla_sync.sh..."
          zsh -n tesla_sync.sh

      - name: Verify CLI Help & Flags
        run: |
          chmod +x tesla_sync.sh run_exportdash.sh
          ./tesla_sync.sh --help
          ./tesla_sync.sh --doctor || true
          ./run_exportdash.sh --help

      - name: Verify Embedded Python Scripts
        run: |
          python3 -c "import ast; print('Python 3 AST compiler ready')"
